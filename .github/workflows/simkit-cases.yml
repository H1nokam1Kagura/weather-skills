name: simkit-cases

# Frozen SIMKIT v2.7 cases in the traced Linux container (owner ruling
# container_route_ruling_2026-10-13). Oracles are PROPOSED: every score is diagnostic. Failed
# cases are never retried automatically; harness failures are recorded as HARNESS_ERROR,
# distinct from system-under-test failures.
#
# Live roles (kong_secret_ruling_2026-10-13): the Kong key is the Actions secret
# KONG_ANTHROPIC_KEY, exposed ONLY to the step that starts the host-side relay
# (container_harness/relay_ci.sh relay-start) and to the host-side key-absence scan. Run
# containers never receive it: a live-role container joins a docker --internal network whose
# only reachable endpoint is the relay port on the bridge gateway (iptables, proven by the
# relay-smoke probes) and gets only SIMKIT_RELAY_URL/TOKEN/RUN_ID/MODEL (-e NAME, values in the
# docker client env). Fixture/substituted containers keep --network none. Synthetic data only;
# the relay audit carries status/via/request-id/model/usage only.
#
# Live spend guard (LIVE-WAVE-BRIEF sub-wave 4a; owner ruling live_spend_authorization_2026-10-15):
# any selection with live-role cases needs an explicit live_max_cases, and admission fails above
# it or above the 5M-token run cap (container_harness/relay_usage.py live-gate). Live case jobs
# run at most 3 at a time; each passes its relay caps (from the admission matrix row, else
# conservative defaults until case_driver fills them) to relay-start, keeps its exited container
# for the docker-export key scan, then always removes it. The report carries per-case relay
# usage, LIVE_TRANSPORT_FAULT / RELAY_GUARD_ABORT and the rerun-eligible list; a rerun dispatch
# names the original run in rerun_of_run_id so both attempts are reported. Admission refuses a
# rerun (relay_usage.py rerun-gate, before any case job) unless every selected case is on the
# original's rerun-eligible list, has not been rerun already, and is past its earliest rerun time.
on:
  workflow_dispatch:
    inputs:
      selector:
        description: "'admission' | 'substituted' (runnable offline cases) | 'live' (runnable live-role cases; paid) | 'relay-smoke' (ONE synthetic call container->relay->Kong) | 'relay-dedup-smoke' (ONE reviewer-sized dedup-encoded synthetic call; paid, est. ~USD 0.06, relay-capped at USD 1) | 'relay-role-smoke' (one synthetic call per live role variant, each answer judged by the controller; paid, est. ~USD 0.40, relay-capped at USD 2) | comma-separated case ids"
        required: true
        default: admission
      max_parallel:
        description: "max concurrent case jobs (live-role runs are capped at 3)"
        required: false
        default: "8"
      live_max_cases:
        description: "REQUIRED for any run selecting live-role cases (paid): the most live cases this run may execute; admission fails above it"
        required: false
        default: ""
      rerun_of_run_id:
        description: "re-dispatch of rerun-eligible cases only: the ORIGINAL run's id; its results are reported alongside this run's, never replaced"
        required: false
        default: ""
  push:
    branches: [feat/simkit-gh-cases-snowyowl]

permissions:
  contents: read

concurrency:
  group: simkit-cases-${{ github.ref }}
  cancel-in-progress: false

env:
  # push = smoke: at most these two cases (one fault/control pair), and only if admitted.
  SMOKE_IDS: DEV-E2E-V2_7-E02-P1-CTL,DEV-E2E-V2_7-E02-P1-INJ

jobs:
  relay-smoke:
    # ONE tiny synthetic verifier call (claude-sonnet-4-6, max_tokens 256) through
    # container -> host relay -> Kong, with egress probes and a host-side key-absence scan.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.selector == 'relay-smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OUT: ${{ github.workspace }}/relay-smoke-out
      RELAY_DIR: /tmp/simkit-relay  # outside every uploaded path; runner context is not allowed in job env
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Runner Kong client + relay offline tests (pinned SDK, no network, no secret)
        run: |
          python -m pip install --quiet -r relay/runner_kit/requirements.txt pytest==9.1.1
          python -B -m pytest -q -p no:cacheprovider \
            tools/workflow/tests/test_runner_kong_client.py tools/workflow/tests/test_relay_roles.py

      - name: Build harness image
        id: build
        run: |
          mkdir -p "$OUT"
          IMG="simkit-harness-ctl:${GITHUB_SHA::12}"
          python container_harness/launch.py build --tag "$IMG" \
            --context "$RUNNER_TEMP/harness-ctx" --record "$OUT/build.json"
          echo "image=$IMG" >> "$GITHUB_OUTPUT"

      - name: Relay-only network (docker --internal + iptables)
        run: bash container_harness/relay_ci.sh net-up "$RELAY_DIR"

      - name: Start host relay (the ONLY step besides the key scan that sees the Kong key)
        env:
          KONG_ANTHROPIC_KEY: ${{ secrets.KONG_ANTHROPIC_KEY }}
          RELAY_ROLES: verifier
          RELAY_MAX_REQUESTS: "1"
          RELAY_MAX_TOKENS: "256"
          RELAY_RUN_SECONDS: "900"
        run: bash container_harness/relay_ci.sh relay-start "$RELAY_DIR"

      - name: Smoke container (probes + one role call; no key, no exec, SYS_PTRACE only)
        run: |
          python container_harness/launch.py relay-smoke --image "${{ steps.build.outputs.image }}" \
            --out "$OUT" --relay-dir "$RELAY_DIR"

      - name: Key-absence proof (host-side scan of the exported container + artifacts; counts only)
        if: always()
        env:
          KONG_ANTHROPIC_KEY: ${{ secrets.KONG_ANTHROPIC_KEY }}
        run: |
          c=$(cat "$OUT/container.txt" 2>/dev/null || true)
          python -I container_harness/kong_key_scan.py ${c:+--container "$c"} \
            --scan-dir "$OUT" --scan-dir "$RELAY_DIR" --out "$OUT/key-scan.json"

      - name: Tear down relay, rules, network and container
        if: always()
        run: |
          c=$(cat "$OUT/container.txt" 2>/dev/null || true)
          [ -n "$c" ] && docker rm -f "$c" > /dev/null
          bash container_harness/relay_ci.sh teardown "$RELAY_DIR"
          mkdir -p "$OUT/relay"
          cp "$RELAY_DIR"/*.json "$RELAY_DIR"/*.jsonl "$RELAY_DIR"/*.txt "$RELAY_DIR"/relay.std* "$OUT/relay/" 2>/dev/null || true
          test ! -e "$RELAY_DIR/secret"

      - name: Assert smoke + summary
        run: python -I container_harness/relay_smoke_report.py "$OUT" "$OUT/relay"

      - name: Upload relay smoke evidence (no token, no key)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simkit-relay-smoke
          path: relay-smoke-out
          retention-days: 30

  relay-dedup-smoke:
    # ONE reviewer-sized synthetic reviewer call (claude-sonnet-4-6, max_tokens 2048 as in the
    # live case jobs, temperature 0) through container -> host relay -> Kong, dedup-sha256/1-
    # encoded by RelayRoles (~68 KB body for a ~182 KB payload). The answer's binding_hash must
    # equal a per-run binding that exists only in a shared block, so the model provably resolved
    # the $shared reference; nothing in the data addresses the model. Same isolation, secret
    # scoping, probes and key-absence scan as relay-smoke.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.selector == 'relay-dedup-smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OUT: ${{ github.workspace }}/relay-dedup-smoke-out
      RELAY_DIR: /tmp/simkit-relay  # outside every uploaded path; runner context is not allowed in job env
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Runner Kong client + relay offline tests + dedup payload tests (no network, no secret)
        run: |
          python -m pip install --quiet -r relay/runner_kit/requirements.txt pytest==9.1.1 pyyaml==6.0.3
          python -B -m pytest -q -p no:cacheprovider \
            tools/workflow/tests/test_runner_kong_client.py tools/workflow/tests/test_relay_roles.py \
            container_harness/tests/test_relay_dedup_smoke.py

      - name: Build harness image
        id: build
        run: |
          mkdir -p "$OUT"
          IMG="simkit-harness-ctl:${GITHUB_SHA::12}"
          python container_harness/launch.py build --tag "$IMG" \
            --context "$RUNNER_TEMP/harness-ctx" --record "$OUT/build.json"
          echo "image=$IMG" >> "$GITHUB_OUTPUT"

      - name: Relay-only network (docker --internal + iptables)
        run: bash container_harness/relay_ci.sh net-up "$RELAY_DIR"

      - name: Start host relay (the ONLY step besides the key scan that sees the Kong key)
        env:
          KONG_ANTHROPIC_KEY: ${{ secrets.KONG_ANTHROPIC_KEY }}
          RELAY_ROLES: reviewer
          RELAY_MAX_REQUESTS: "1"
          RELAY_MAX_TOKENS: "2048"
          RELAY_MAX_TOTAL_TOKENS: "150000"
          RELAY_BUDGET: "1"
          RELAY_RUN_SECONDS: "900"
        run: bash container_harness/relay_ci.sh relay-start "$RELAY_DIR"

      - name: Dedup smoke container (probes + one reviewer call; no key, no exec, SYS_PTRACE only)
        run: |
          python container_harness/launch.py relay-smoke --client relay_dedup_smoke \
            --image "${{ steps.build.outputs.image }}" --out "$OUT" --relay-dir "$RELAY_DIR"

      - name: Key-absence proof (host-side scan of the exported container + artifacts; counts only)
        if: always()
        env:
          KONG_ANTHROPIC_KEY: ${{ secrets.KONG_ANTHROPIC_KEY }}
        run: |
          c=$(cat "$OUT/container.txt" 2>/dev/null || true)
          python -I container_harness/kong_key_scan.py ${c:+--container "$c"} \
            --scan-dir "$OUT" --scan-dir "$RELAY_DIR" --out "$OUT/key-scan.json"

      - name: Tear down relay, rules, network and container
        if: always()
        run: |
          c=$(cat "$OUT/container.txt" 2>/dev/null || true)
          [ -n "$c" ] && docker rm -f "$c" > /dev/null
          bash container_harness/relay_ci.sh teardown "$RELAY_DIR"
          mkdir -p "$OUT/relay"
          cp "$RELAY_DIR"/*.json "$RELAY_DIR"/*.jsonl "$RELAY_DIR"/*.txt "$RELAY_DIR"/relay.std* "$OUT/relay/" 2>/dev/null || true
          test ! -e "$RELAY_DIR/secret"

      - name: Assert dedup smoke + summary
        run: python -I container_harness/relay_dedup_smoke_report.py "$OUT" "$OUT/relay"

      - name: Upload relay dedup smoke evidence (no token, no key)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simkit-relay-dedup-smoke
          path: relay-dedup-smoke-out
          retention-days: 30

  relay-role-smoke:
    # ONE synthetic call per LIVE role and payload variant of the 34 live cases (8 calls:
    # compiler; planner with review_evidence_request; evidence_checker; reviewer with
    # review_evidence + claim_check; repairer with review_evidence_request after a rejected
    # review; reviewer with the planner's rationale; verifier; shadow_policy with the E09-P2
    # note; container_harness/relay_role_smoke.py CALLS says why), claude-sonnet-4-6,
    # temperature 0, forced tool use, through container -> host relay -> Kong. The REAL
    # controller builds every payload (frozen synthetic scenario) and judges every answer in
    # the container with its own acceptance code; the job FAILS unless each answer is accepted.
    # Estimated cost at the pinned list price ($3 / $15 per MTok, ~3.6 B per input token):
    # ~USD 0.40 per dispatch (reviewer x2 ~0.07 each at ~21k input tokens, planner and repairer
    # ~0.08 each at ~18k in / ~1.5k out, evidence_checker ~0.06, compiler / verifier /
    # shadow_policy ~0.005 each); the relay's summed worst case (bytes as tokens, full output
    # ceilings) is ~USD 1.35 and ~366k tokens, under the caps below.
    # Relay caps: 8 requests, USD 2, then the cap probe makes the relay stop itself. Same
    # isolation, secret scoping, probes, key-absence scan and teardown as relay-smoke.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.selector == 'relay-role-smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      OUT: ${{ github.workspace }}/relay-role-smoke-out
      RELAY_DIR: /tmp/simkit-relay  # outside every uploaded path; runner context is not allowed in job env
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Runner Kong client + relay offline tests + role smoke tests (no network, no secret)
        run: |
          python -m pip install --quiet -r relay/runner_kit/requirements.txt pytest==9.1.1 pyyaml==6.0.3
          python -B -m pytest -q -p no:cacheprovider \
            tools/workflow/tests/test_runner_kong_client.py tools/workflow/tests/test_relay_roles.py \
            container_harness/tests/test_relay_role_smoke.py

      - uses: astral-sh/setup-uv@v8.1.0

      - name: Controller-judge offline tests (real controller, fake worker; no network, no secret)
        run: |
          uv sync --group dev
          uv run pytest -q -p no:cacheprovider tools/workflow/tests/test_relay_role_smoke_controller.py

      - name: Build harness image
        id: build
        run: |
          mkdir -p "$OUT"
          IMG="simkit-harness-ctl:${GITHUB_SHA::12}"
          python container_harness/launch.py build --tag "$IMG" \
            --context "$RUNNER_TEMP/harness-ctx" --record "$OUT/build.json"
          echo "image=$IMG" >> "$GITHUB_OUTPUT"

      - name: Relay-only network (docker --internal + iptables)
        run: bash container_harness/relay_ci.sh net-up "$RELAY_DIR"

      - name: Start host relay (the ONLY step besides the key scan that sees the Kong key)
        env:
          KONG_ANTHROPIC_KEY: ${{ secrets.KONG_ANTHROPIC_KEY }}
          RELAY_ROLES: compiler evidence_checker planner repairer reviewer shadow_policy verifier
          RELAY_MAX_REQUESTS: "8"
          RELAY_MAX_TOKENS: "2048"
          RELAY_MAX_TOTAL_TOKENS: "500000"
          RELAY_BUDGET: "2"
          RELAY_RUN_SECONDS: "3300"
        run: bash container_harness/relay_ci.sh relay-start "$RELAY_DIR"

      - name: Role smoke container (probes + one call per live role variant; no key, no exec, SYS_PTRACE only)
        run: |
          python container_harness/launch.py relay-smoke --client relay_role_smoke --timeout 3000 \
            --image "${{ steps.build.outputs.image }}" --out "$OUT" --relay-dir "$RELAY_DIR"

      - name: Key-absence proof (host-side scan of the exported container + artifacts; counts only)
        if: always()
        env:
          KONG_ANTHROPIC_KEY: ${{ secrets.KONG_ANTHROPIC_KEY }}
        run: |
          c=$(cat "$OUT/container.txt" 2>/dev/null || true)
          python -I container_harness/kong_key_scan.py ${c:+--container "$c"} \
            --scan-dir "$OUT" --scan-dir "$RELAY_DIR" --out "$OUT/key-scan.json"

      - name: Tear down relay, rules, network and container
        if: always()
        run: |
          c=$(cat "$OUT/container.txt" 2>/dev/null || true)
          [ -n "$c" ] && docker rm -f "$c" > /dev/null
          bash container_harness/relay_ci.sh teardown "$RELAY_DIR"
          mkdir -p "$OUT/relay"
          cp "$RELAY_DIR"/*.json "$RELAY_DIR"/*.jsonl "$RELAY_DIR"/*.txt "$RELAY_DIR"/relay.std* "$OUT/relay/" 2>/dev/null || true
          test ! -e "$RELAY_DIR/secret"

      - name: Assert role smoke + summary (every live role's answer accepted by the controller)
        run: python -I container_harness/relay_role_smoke_report.py "$OUT" "$OUT/relay"

      - name: Upload relay role smoke evidence (no token, no key)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simkit-relay-role-smoke
          path: relay-role-smoke-out
          retention-days: 30

  admission:
    if: github.event_name != 'workflow_dispatch' || (github.event.inputs.selector != 'relay-smoke' && github.event.inputs.selector != 'relay-dedup-smoke' && github.event.inputs.selector != 'relay-role-smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read  # rerun_of_run_id: download the ORIGINAL run's simkit-results for the rerun gate
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
      live_count: ${{ steps.matrix.outputs.live_count }}
      max_parallel: ${{ steps.matrix.outputs.max_parallel }}
      image: ${{ steps.build.outputs.image }}
    env:
      OUT: ${{ github.workspace }}/admission-out
      SELECTOR: ${{ github.event_name == 'push' && 'smoke' || github.event.inputs.selector }}
      LIVE_MAX_CASES: ${{ github.event.inputs.live_max_cases }}
      MAX_PARALLEL_INPUT: ${{ github.event.inputs.max_parallel }}
      RERUN_OF_RUN_ID: ${{ github.event.inputs.rerun_of_run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Harness unit tests (analyzer + report; not in ci.yml testpaths)
        run: |
          python -m pip install --quiet pytest==9.1.1 pyyaml==6.0.3
          # test_case_driver_fixture_ops needs the controller stack; ci.yml runs it there.
          python -B -m pytest -q -p no:cacheprovider container_harness/tests \
            --ignore=container_harness/tests/test_case_driver_fixture_ops.py

      - name: Verify frozen v2.7 package (committed fixture vs FINAL-PINS) and input pins
        run: |
          mkdir -p "$OUT"
          python -B -c "import sys, json, pathlib, tempfile; sys.path.insert(0, 'tests'); import frozen_v27 as f; root = f.extract_fixture(dest=pathlib.Path(tempfile.mkdtemp())); print(json.dumps({'frozen_root': str(root), 'final_pins_sha256': f.FINAL_PINS_SHA256, 'verified': True}))" | tee "$OUT/frozen-verify.json"
          python -I container_harness/verify_inputs.py <(python -c "import json; p = json.load(open('container_harness/pinned_inputs.json')); print(json.dumps({'supplement_id': p['supplement_id'], 'files': [{'role': f['role'], 'path': f['repo_path'], 'sha256': f['sha256']} for f in p['files']]}))") --out "$OUT/input-verify.json" > /dev/null

      - name: Build harness image (once)
        id: build
        run: |
          IMG="simkit-harness-ctl:${GITHUB_SHA::12}"
          python container_harness/launch.py build --tag "$IMG" \
            --context "$RUNNER_TEMP/harness-ctx" --record "$OUT/build.json"
          echo "image=$IMG" >> "$GITHUB_OUTPUT"

      - name: Frozen-runner capability admission (all 66 cases; never executes a case)
        run: |
          python container_harness/launch.py admission --image "${{ steps.build.outputs.image }}" \
            --out "$OUT/ADMISSION.json" --selector "$SELECTOR" --smoke-ids "$SMOKE_IDS"

      - name: Case matrix
        id: matrix
        run: |
          python -B - "$OUT/ADMISSION.json" >> "$GITHUB_OUTPUT" <<'EOF'
          import json, os, sys
          sys.path.insert(0, "container_harness")
          import relay_usage
          a = json.load(open(sys.argv[1]))
          live = len(relay_usage.live_rows(a))
          print("matrix=" + json.dumps({"include": a["matrix"]}))
          print("count=" + str(len(a["matrix"])))
          print("live_count=" + str(live))
          print("max_parallel=" + str(relay_usage.max_parallel(os.environ.get("MAX_PARALLEL_INPUT"), live)))
          EOF
          python -I container_harness/relay_usage.py live-gate "$OUT/ADMISSION.json" \
            --live-max-cases "$LIVE_MAX_CASES" --out "$OUT/LIVE-GATE.json" \
            | tee -a "$GITHUB_STEP_SUMMARY" || true  # recorded here; enforced after the upload
          python -B - "$OUT/ADMISSION.json" >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json, sys
          sys.path.insert(0, "container_harness")
          import cases_report
          a = json.load(open(sys.argv[1]))
          c = a["counts"]
          g = cases_report.admission_gate(a)
          if c["selected"] == 0:
              print(f"## {g['message']}\n")
          if g["status"] == "FAIL":
              print("**This run will FAIL: the selector is meant to execute cases.**\n")
          print(f"### Admission (frozen runner)\n\nselector `{a['selector']}`: {c['total']} cases, "
                f"admitted {c['admitted']}, NOT_IMPLEMENTED {c['not_implemented']}, "
                f"selected {c['selected']}\n\ndispositions: `{json.dumps(c['dispositions'])}`\n")
          for cap, n in list(a["missing_capability_counts"].items())[:10]:
              print(f"- {cap}: {n} ({a['missing_capability_reasons'].get(cap)})")
          EOF

      - name: Original run's results for the rerun gate (rerun dispatch only)
        if: github.event.inputs.rerun_of_run_id != ''
        # No continue-on-error: a rerun whose original cannot be read is refused at admission.
        uses: actions/download-artifact@v4
        with:
          name: simkit-results
          path: rerun-prior
          run-id: ${{ github.event.inputs.rerun_of_run_id }}
          github-token: ${{ github.token }}

      - name: Rerun gate record (rerun dispatch only; uploaded with the admission evidence)
        # Recorded even when the download failed, so RERUN-GATE.json names the refusal.
        if: always() && github.event.inputs.rerun_of_run_id != ''
        run: |
          python -I container_harness/relay_usage.py rerun-gate "$OUT/ADMISSION.json" \
            --prior-results rerun-prior/RESULTS.json --rerun-of-run-id "$RERUN_OF_RUN_ID" \
            --out "$OUT/RERUN-GATE.json" | tee -a "$GITHUB_STEP_SUMMARY" || true  # enforced after the upload

      - name: Save image for the case jobs
        if: steps.matrix.outputs.count != '0'
        run: |
          docker save "${{ steps.build.outputs.image }}" | gzip -1 > "$RUNNER_TEMP/harness-image.tar.gz"
          ls -l "$RUNNER_TEMP/harness-image.tar.gz"

      - name: Upload image
        if: steps.matrix.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: simkit-harness-image
          path: ${{ runner.temp }}/harness-image.tar.gz
          retention-days: 2
          compression-level: 0

      - name: Upload admission
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simkit-admission
          path: admission-out
          retention-days: 30

      - name: Unknown case ids in the selector fail the run (after the admission upload)
        run: |
          python -c "import json, sys; a = json.load(open('$OUT/ADMISSION.json')); u = a['unknown_selected_ids']; print('unknown ids:', u); sys.exit(1 if u else 0)"

      - name: A selector meant to execute cases that selects none fails the run (after the admission upload)
        # 'admission' / 'relay-smoke' / push 'smoke' select nothing by design and pass here; the
        # report job's execution gate also fails a run whose EXECUTED count is below selected.
        run: |
          python -B -c "import json, sys; sys.path.insert(0, 'container_harness'); import cases_report as r; g = r.admission_gate(json.load(open('$OUT/ADMISSION.json'))); print('execution gate (admission):', json.dumps(g)); sys.exit(1 if g['status'] == 'FAIL' else 0)"

      - name: Live spend gate (live_max_cases + run token cap; after the admission upload)
        # Any selection with live-role cases (paid Kong calls) needs an explicit live_max_cases;
        # more live cases than that, or per-case token caps summing above 5M, fail the run here,
        # so no case job (and no Kong call) starts.
        run: python -I container_harness/relay_usage.py live-gate "$OUT/ADMISSION.json" --live-max-cases "$LIVE_MAX_CASES" --out "$RUNNER_TEMP/live-gate.json"

      - name: Rerun gate (rerun dispatch only; after the admission upload)
        # Owner ruling live_spend_authorization_2026-10-15.rerun_on_gateway_fault, enforced
        # before any case job: every selected case must be on the original run's rerun_eligible
        # list, have no rerun there yet, and be past its earliest rerun time. The report job
        # keeps its own flags for the same conditions (defence in depth).
        if: github.event.inputs.rerun_of_run_id != ''
        run: |
          python -I container_harness/relay_usage.py rerun-gate "$OUT/ADMISSION.json" \
            --prior-results rerun-prior/RESULTS.json --rerun-of-run-id "$RERUN_OF_RUN_ID" \
            --out "$RUNNER_TEMP/rerun-gate.json"

  case:
    needs: admission
    if: needs.admission.outputs.count != '0' && needs.admission.outputs.count != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      # the input (default 8); 3 when any live-role case is selected (relay_usage.max_parallel)
      max-parallel: ${{ fromJSON(needs.admission.outputs.max_parallel || '8') }}
      matrix: ${{ fromJSON(needs.admission.outputs.matrix) }}
    env:
      CASE_OUT: ${{ github.workspace }}/case-out/${{ matrix.case_id }}
      IMG: ${{ needs.admission.outputs.image }}
      RELAY_DIR: /tmp/simkit-relay  # outside every uploaded path; runner context is not allowed in job env
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: simkit-harness-image
          path: ${{ runner.temp }}/img

      - uses: actions/download-artifact@v4
        with:
          name: simkit-admission
          path: ${{ runner.temp }}/admission

      - name: Load image and check it is the admission job's build
        run: |
          gunzip -c "$RUNNER_TEMP/img/harness-image.tar.gz" | docker load
          want=$(python -c "import json; print(json.load(open('$RUNNER_TEMP/admission/build.json'))['image_id'])")
          got=$(docker image inspect -f '{{.Id}}' "$IMG")
          echo "built=$want loaded=$got"
          test "$want" = "$got"

      - name: Relay-only network (live-role case)
        if: matrix.role_mode == 'live'
        run: bash container_harness/relay_ci.sh net-up "$RELAY_DIR"

      - name: Relay caps from the admission matrix row (live-role case)
        # expected_calls / max_requests / max_total_tokens / max_model_usd / live_roles come from
        # the matrix row once case_driver (sub-wave 4b) fills them; until then conservative
        # defaults (24 requests, 200000 tokens, USD 5, all relay roles). Each cap's source is
        # recorded in relay-caps.json, copied into the case's relay evidence.
        id: caps
        if: matrix.role_mode == 'live'
        env:
          MATRIX_ROW: ${{ toJSON(matrix) }}
        run: |
          python -I container_harness/relay_usage.py caps --out "$RUNNER_TEMP/relay-caps.json" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/relay-caps.json"

      - name: Runner Kong client (pinned SDK; live-role case; no network beyond PyPI, no secret)
        # The relay's --client runner refuses to start without the pinned SDK (run 38951255405:
        # "needs anthropic==1.13.0, found None"); the smoke jobs install the same file.
        if: matrix.role_mode == 'live'
        run: python -m pip install --quiet -r relay/runner_kit/requirements.txt

      - name: Start host relay (live-role case; the only step that sees the Kong key)
        if: matrix.role_mode == 'live'
        env:
          KONG_ANTHROPIC_KEY: ${{ secrets.KONG_ANTHROPIC_KEY }}
          RELAY_ROLES: ${{ steps.caps.outputs.roles }}
          RELAY_MAX_REQUESTS: ${{ steps.caps.outputs.max_requests }}
          RELAY_MAX_TOTAL_TOKENS: ${{ steps.caps.outputs.max_total_tokens }}
          RELAY_BUDGET: ${{ steps.caps.outputs.budget_usd }}
          RELAY_MAX_TOKENS: "2048"
          RELAY_RUN_SECONDS: "2100"
        run: bash container_harness/relay_ci.sh relay-start "$RELAY_DIR"

      - name: Run case in the traced container (no network; live roles via the relay only)
        # A live-role case keeps its exited container (name in $CASE_OUT/container.txt) for the
        # docker-export key scan below; the removal step after it always runs.
        run: |
          relay=()
          if [ "${{ matrix.role_mode }}" = live ]; then relay=(--relay-dir "$RELAY_DIR" --keep-container); fi
          python container_harness/launch.py run case --case-id "${{ matrix.case_id }}" \
            --image "$IMG" --out "$CASE_OUT" "${relay[@]}"

      - name: Tear down relay (live-role case)
        if: always() && matrix.role_mode == 'live'
        run: |
          bash container_harness/relay_ci.sh teardown "$RELAY_DIR"
          mkdir -p "$CASE_OUT/relay"
          cp "$RELAY_DIR"/*.json "$RELAY_DIR"/*.jsonl "$RELAY_DIR"/*.txt "$RELAY_DIR"/relay.std* "$CASE_OUT/relay/" 2>/dev/null || true
          cp "$RUNNER_TEMP/relay-caps.json" "$CASE_OUT/relay/" 2>/dev/null || true
          test ! -e "$RELAY_DIR/secret"

      - name: Key-absence scan of the exported container + case artifacts + relay dir (live-role case; counts only)
        if: always() && matrix.role_mode == 'live'
        env:
          KONG_ANTHROPIC_KEY: ${{ secrets.KONG_ANTHROPIC_KEY }}
        run: |
          c=$(cat "$CASE_OUT/container.txt" 2>/dev/null || true)
          rc=0
          python -I container_harness/kong_key_scan.py ${c:+--container "$c"} \
            --scan-dir "$CASE_OUT" --scan-dir "$RELAY_DIR" --out "$RUNNER_TEMP/key-scan.json" || rc=$?
          mkdir -p "$CASE_OUT/relay"
          cp "$RUNNER_TEMP/key-scan.json" "$CASE_OUT/relay/" 2>/dev/null || true
          exit "$rc"

      - name: Remove the kept case container (live-role case; always, after the key scan)
        if: always() && matrix.role_mode == 'live'
        run: |
          c=$(cat "$CASE_OUT/container.txt" 2>/dev/null || true)
          if [ -n "$c" ]; then docker rm -f "$c" > /dev/null; fi
          if [ -n "$c" ] && docker container inspect "$c" > /dev/null 2>&1; then exit 1; fi

      - name: Pack raw trace separately
        if: always()
        run: |
          mkdir -p "$CASE_OUT"
          if [ -d "$CASE_OUT/harness-out/trace" ]; then
            tar -czf "$RUNNER_TEMP/raw-trace.tgz" -C "$CASE_OUT/harness-out" trace
            rm -rf "$CASE_OUT/harness-out/trace"
          fi

      - name: Upload case result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: case-${{ matrix.case_id }}
          path: case-out
          retention-days: 30

      - name: Upload raw trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-${{ matrix.case_id }}
          path: ${{ runner.temp }}/raw-trace.tgz
          retention-days: 7
          if-no-files-found: ignore

  report:
    needs: [admission, case]
    if: always() && needs.admission.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read  # rerun_of_run_id: download the ORIGINAL run's simkit-results artifact
    env:
      RERUN_OF_RUN_ID: ${{ github.event.inputs.rerun_of_run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: simkit-admission
          path: report-in/admission

      - uses: actions/download-artifact@v4
        # No case artifacts (nothing admitted/selected) is a normal outcome; a selected case
        # without an artifact is reported HARNESS_ERROR no_case_artifact, never dropped.
        continue-on-error: true
        with:
          pattern: case-*
          path: report-in/cases

      - name: Original run's results (rerun dispatch only; reported alongside, never replaced)
        if: github.event.inputs.rerun_of_run_id != ''
        # No continue-on-error: a rerun whose original cannot be read must not report as a
        # first attempt (cases_report.py --prior-results also refuses an absent file).
        uses: actions/download-artifact@v4
        with:
          name: simkit-results
          path: report-in/prior
          run-id: ${{ github.event.inputs.rerun_of_run_id }}
          github-token: ${{ github.token }}

      - name: Aggregate RESULTS.json + RESULTS.md
        run: |
          mkdir -p results
          mkdir -p report-in/cases
          prior=()
          if [ -n "$RERUN_OF_RUN_ID" ]; then prior=(--prior-results report-in/prior/RESULTS.json); fi
          python -B container_harness/cases_report.py report-in/admission/ADMISSION.json report-in/cases \
            --out results/RESULTS.json --markdown results/RESULTS.md \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "${prior[@]}"
          cp report-in/admission/ADMISSION.json results/
          cat results/RESULTS.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simkit-results
          path: results
          retention-days: 30

      - name: Execution gate (after the results upload; fails when selected cases did not all EXECUTE)
        run: python -B container_harness/cases_report.py gate results/RESULTS.json
