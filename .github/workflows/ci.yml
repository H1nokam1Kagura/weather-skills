name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uvx ruff@0.16.0 format --check
      - run: uvx ruff@0.16.0 check

  inline-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv run --script tools/check_inline_deps.py skills/
      - run: uv run --script tools/check_cftime_deps.py skills/

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Sharded by testpath (the live wave pushed the single job past its 10-minute limit at
    # 51089d0, run 38927195399). The shards' union must equal pyproject testpaths: the
    # coverage step below fails if a testpath is added or dropped without a shard.
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: tests
            paths: tests
          - name: skills-registry-workflow
            paths: skills registry tools/workflow/tests
    name: pytest (${{ matrix.shard.name }})
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: tests/test_capability_signatures.py diffs each D4 record's
          # reviewed_commit against HEAD and fails closed on a shallow clone.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - run: uv sync --group dev
      - name: Shards cover every configured testpath
        run: |
          uv run python - <<'PY'
          import tomllib
          testpaths = set(tomllib.load(open("pyproject.toml", "rb"))["tool"]["pytest"]["ini_options"]["testpaths"])
          shards = {"tests", "skills", "registry", "tools/workflow/tests"}
          assert testpaths == shards, (sorted(testpaths), sorted(shards))
          PY
      - run: uv run pytest --durations=15 ${{ matrix.shard.paths }}
      # container_harness/ is outside testpaths (its other tests run in simkit-cases.yml's slim
      # step), but this module needs the controller stack: the CAP-FIXTURE-OP record lists it.
      - if: matrix.shard.name == 'skills-registry-workflow'
        run: uv run pytest -q container_harness/tests/test_case_driver_fixture_ops.py

  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          matrix=$(find skills -mindepth 3 -maxdepth 3 -path '*/scripts/*' -name '*.py' \
            | sort \
            | jq -R -s -c 'split("\n") | map(select(length > 0)) | map(split("/") | {skill: .[1], script: .[3]})')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  script-help:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - run: |
          f="skills/${{ matrix.skill }}/scripts/${{ matrix.script }}"
          floor=$(grep -m1 -oE 'requires-python[[:space:]]*=[[:space:]]*">=[[:space:]]*[0-9]+\.[0-9]+' "$f" | grep -oE '[0-9]+\.[0-9]+' | head -1)
          if [ -z "$floor" ]; then
            echo "::error file=$f::no requires-python floor found in PEP 723 header"
            exit 1
          fi
          echo "::group::$f at declared floor py$floor"
          uv run --python "$floor" --script "$f" --help
          echo "::endgroup::"
