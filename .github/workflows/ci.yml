name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uvx ruff@0.16.0 format --check
      - run: uvx ruff@0.16.0 check

  inline-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv run --script tools/check_inline_deps.py skills/
      - run: uv run --script tools/check_cftime_deps.py skills/

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Sharded (the live wave pushed the single job past its 10-minute limit at 51089d0, run
    # 38927195399). skills/ must share a shard with tests/: skills tests import helpers via
    # `from conftest import ...`, which resolves to tests/conftest.py only when tests/ is
    # collected (a skills-only shard imports the root conftest.py and fails to collect). So
    # shard 1 = skills + registry + tests/ minus the HEAVY modules; shard 2 = tools/workflow/tests
    # + exactly those modules (slowest setups in the first sharded run). The coverage step fails if the
    # shards stop covering pyproject testpaths or the moved files.
    strategy:
      fail-fast: false
      matrix:
        shard: [main, workflow-heavy]
    name: pytest (${{ matrix.shard }})
    env:
      HEAVY: >-
        tests/test_live_roles_adapter.py tests/test_live_wave_adapter.py
        tests/test_resume_family_adapter.py tests/test_fixture_rereview_adapter.py
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: tests/test_capability_signatures.py diffs each D4 record's
          # reviewed_commit against HEAD and fails closed on a shallow clone.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - run: uv sync --group dev
      - name: Shards cover every configured testpath and every moved module
        run: |
          uv run python - <<'PY'
          import os, tomllib
          from pathlib import Path
          testpaths = set(tomllib.load(open("pyproject.toml", "rb"))["tool"]["pytest"]["ini_options"]["testpaths"])
          assert testpaths == {"skills", "registry", "tests", "tools/workflow/tests"}, sorted(testpaths)
          heavy = os.environ["HEAVY"].split()
          assert heavy and all(Path(h).is_file() and h.startswith("tests/") for h in heavy), heavy
          PY
      - if: matrix.shard == 'main'
        run: uv run pytest --durations=15 skills registry tests $(printf -- '--ignore=%s ' $HEAVY)
      - if: matrix.shard == 'workflow-heavy'
        run: uv run pytest --durations=15 tools/workflow/tests $HEAVY
      # container_harness/ is outside testpaths (its other tests run in simkit-cases.yml's slim
      # step), but this module needs the controller stack: the CAP-FIXTURE-OP record lists it.
      - if: matrix.shard == 'workflow-heavy'
        run: uv run pytest -q container_harness/tests/test_case_driver_fixture_ops.py

  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          matrix=$(find skills -mindepth 3 -maxdepth 3 -path '*/scripts/*' -name '*.py' \
            | sort \
            | jq -R -s -c 'split("\n") | map(select(length > 0)) | map(split("/") | {skill: .[1], script: .[3]})')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  script-help:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - run: |
          f="skills/${{ matrix.skill }}/scripts/${{ matrix.script }}"
          floor=$(grep -m1 -oE 'requires-python[[:space:]]*=[[:space:]]*">=[[:space:]]*[0-9]+\.[0-9]+' "$f" | grep -oE '[0-9]+\.[0-9]+' | head -1)
          if [ -z "$floor" ]; then
            echo "::error file=$f::no requires-python floor found in PEP 723 header"
            exit 1
          fi
          echo "::group::$f at declared floor py$floor"
          uv run --python "$floor" --script "$f" --help
          echo "::endgroup::"
