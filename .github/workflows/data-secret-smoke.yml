name: data-secret-smoke

# Checks that the Cumulus SAS and TAHMO credentials stored as Actions secrets authenticate.
# Prints HTTP status codes and counts only; never echoes a secret (no `set -x`).
on:
  push:
    branches: [ci/data-secret-smoke-snowyowl]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cumulus SAS lists the data container (Azure Blob, one result)
        env:
          SAS: ${{ secrets.AZURE_STORAGE_SAS_TOKEN }}
        run: |
          test -n "$SAS" || { echo "AZURE_STORAGE_SAS_TOKEN is not set"; exit 1; }
          python - <<'PY'
          import os, urllib.parse, urllib.request, urllib.error, re
          raw = os.environ["SAS"].strip().strip("'\"")
          token = raw.split("?", 1)[-1]
          prefix = "live_forecasts/global_model/aurora_s2s/"
          url = ("https://italynorthdata.blob.core.windows.net/data?restype=container&comp=list"
                 f"&prefix={prefix}&maxresults=5&{token}")
          names, marker, pages = [], "", 0
          try:
              while pages < 20 and not names:
                  pages += 1
                  page = url + (f"&marker={urllib.parse.quote(marker)}" if marker else "")
                  with urllib.request.urlopen(page, timeout=30) as r:
                      body = r.read().decode()
                  names += re.findall(r"<Name>([^<]+)</Name>", body)
                  m = re.search(r"<NextMarker>([^<]*)</NextMarker>", body)
                  marker = m.group(1) if m else ""
                  if not marker:
                      break
          except urllib.error.HTTPError as e:
              code = re.search(r"<Code>([^<]+)</Code>", e.read().decode(errors="replace"))
              raise SystemExit(f"cumulus: HTTP {e.code} {code.group(1) if code else ''} (auth or permission failure)")
          print(f"cumulus: HTTP 200 (authenticated, list allowed); {len(names)} blob(s) under {prefix} after {pages} page(s)")
          for n in names[:5]:
              print("  ", n)
          if not names:
              raise SystemExit("cumulus: authenticated, but no blobs found under the prefix")
          PY

      - name: TAHMO credentials list stations (same client + pin as tahmo-fetch)
        if: always()
        env:
          TAHMO_API_USERNAME: ${{ secrets.TAHMO_API_USERNAME }}
          TAHMO_API_PASSWORD: ${{ secrets.TAHMO_API_PASSWORD }}
        run: |
          test -n "$TAHMO_API_USERNAME" -a -n "$TAHMO_API_PASSWORD" || { echo "TAHMO secrets are not set"; exit 1; }
          python -m pip install --quiet "git+https://github.com/rhiza-research/tahmo-api@8ed3adc22b5b7c53d08753e45676e9d4a0a52ab8"
          python - <<'PY'
          import os
          from TAHMO import apiWrapper
          api = apiWrapper()
          api.setCredentials(os.environ["TAHMO_API_USERNAME"], os.environ["TAHMO_API_PASSWORD"])
          stations = api.getStations()
          print(f"tahmo: {len(stations)} station(s) returned")
          if not stations:
              raise SystemExit("tahmo: no stations returned")
          PY
